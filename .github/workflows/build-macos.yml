name: Build PPBind macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach artifacts to, for example v3.20.3 (optional)"
        required: false
        type: string
      upload_to_release:
        description: "Upload the macOS artifacts to the GitHub Release"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build universal macOS package
    runs-on: macos-14
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Ensure macOS Rust targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          rustup target list --installed

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal DMG
        shell: bash
        run: |
          set -euo pipefail
          pnpm tauri build \
            --target universal-apple-darwin \
            --bundles dmg \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          BUNDLE_ROOT="src-tauri/target/universal-apple-darwin/release/bundle"
          APP_PATH=$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -name '*.app' -type d | head -1)
          DMG_PATH=$(find "$BUNDLE_ROOT/dmg" -maxdepth 1 -name '*.dmg' -type f | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "macOS .app bundle not found" >&2
            exit 1
          fi
          if [ -z "$DMG_PATH" ]; then
            echo "macOS .dmg bundle not found" >&2
            exit 1
          fi

          mkdir -p release-macos
          DMG_NAME="PPBind-${VERSION}-macOS-universal-unsigned.dmg"
          ZIP_NAME="PPBind-${VERSION}-macOS-universal-unsigned.zip"
          cp "$DMG_PATH" "release-macos/${DMG_NAME}"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "release-macos/${ZIP_NAME}"

          (
            cd release-macos
            shasum -a 256 "${DMG_NAME}" "${ZIP_NAME}" > SHA256SUMS-macos.txt
          )
          ls -lh release-macos

      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPBind-macOS-universal-unsigned
          path: release-macos/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish macOS files to GitHub Release
        if: ${{ github.event_name == 'push' || inputs.upload_to_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [ -n "${RELEASE_TAG_INPUT:-}" ]; then
            TAG="$RELEASE_TAG_INPUT"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG does not exist" >&2
            exit 1
          fi

          if gh release download "$TAG" \
            --pattern SHA256SUMS.txt \
            --dir release-macos >/dev/null 2>&1; then
            mv release-macos/SHA256SUMS.txt release-macos/SHA256SUMS-existing.txt
          else
            : > release-macos/SHA256SUMS-existing.txt
          fi

          # Preserve the existing platform hashes while replacing any previous macOS entries.
          grep -Ev 'PPBind-.*-macOS-universal-unsigned\.(dmg|zip)$' \
            release-macos/SHA256SUMS-existing.txt \
            > release-macos/SHA256SUMS.txt || true
          cat release-macos/SHA256SUMS-macos.txt >> release-macos/SHA256SUMS.txt

          gh release upload "$TAG" \
            release-macos/PPBind-*-macOS-universal-unsigned.dmg \
            release-macos/PPBind-*-macOS-universal-unsigned.zip \
            release-macos/SHA256SUMS.txt \
            --clobber

          rm -f \
            release-macos/SHA256SUMS-existing.txt \
            release-macos/SHA256SUMS-macos.txt

