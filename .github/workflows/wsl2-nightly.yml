name: WSL2 Nightly

# The full backend suite takes 50+ minutes on a \\wsl.localhost 9P filesystem,
# so it runs nightly instead of per PR. The per-PR gate in ci.yml only runs the
# atomic-write contract test against the same WSL2-backed environment.
on:
  schedule:
    - cron: "23 18 * * *" # 02:23 Beijing time
  workflow_dispatch:

jobs:
  backend-windows-wsl2-full:
    name: Backend Full Suite (Windows + WSL2 home)
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup WSL2
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ github.repository }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ github.repository }}-cargo-

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Prepare WSL2-backed test environment
        shell: pwsh
        run: |
          wsl.exe -d Ubuntu-24.04 -- bash -lc "rm -rf /tmp/cc-switch-windows-test-root && mkdir -p /tmp/cc-switch-windows-test-root/{home,temp} && chmod -R 0777 /tmp/cc-switch-windows-test-root"
          $testRoot = "\\wsl.localhost\Ubuntu-24.04\tmp\cc-switch-windows-test-root"
          $testHome = Join-Path $testRoot "home"
          $testTemp = Join-Path $testRoot "temp"
          foreach ($path in @($testRoot, $testHome, $testTemp)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "WSL2-backed test path is unavailable: $path"
            }
          }
          "CC_SWITCH_TEST_HOME=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_DIR=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile backend tests with native temp
        # link.exe/mt.exe cannot create manifests when TEMP points at a WSL UNC
        # path. Build every test binary here with a native temp dir, record the
        # paths, and execute them directly below instead of re-invoking cargo
        # with TEMP on \\wsl.localhost (which would re-link the crate).
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          $testBinaries = cargo test --tests --manifest-path src-tauri/Cargo.toml --no-run --message-format=json |
            ForEach-Object {
              if ($_ -match '"reason":"compiler-artifact"') {
                $artifact = $_ | ConvertFrom-Json
                if ($artifact.executable -and $artifact.profile.test) {
                  $artifact.executable
                }
              }
            } | Select-Object -Unique -Wait
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not $testBinaries) {
            throw "No test binaries were discovered in cargo compiler artifacts"
          }
          Write-Host "Test binaries:"
          $testBinaries | ForEach-Object { Write-Host "  $_" }
          "CC_SWITCH_TEST_EXES=$($testBinaries -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows-to-WSL2 filesystem contract
        # Run the prebuilt lib test binary directly. Invoking cargo here with
        # TEMP pointing at a WSL UNC path can re-link the crate, and
        # link.exe/mt.exe cannot create manifest temp files on \\wsl.localhost.
        shell: pwsh
        run: |
          $env:TEMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $env:TMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $testExe = ($env:CC_SWITCH_TEST_EXES -split ';') |
            Where-Object { $_ -like '*cc_switch_lib-*' } |
            Select-Object -First 1
          if (-not $testExe) {
            throw "cc_switch_lib test binary was not recorded"
          }
          $testName = "config::tests::atomic_write_replaces_existing_wsl_unc_file"
          $testList = & $testExe --list --ignored
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $expected = "${testName}: test"
          if ($testList -notcontains $expected) {
            throw "Expected ignored test was not discovered: $testName"
          }
          & $testExe $testName --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run full test suite against WSL2-backed home
        # The binaries were linked above with a native temp dir; run them
        # directly so the WSL2-backed HOME/TEMP contract is exercised at test
        # runtime without re-linking on \\wsl.localhost.
        shell: pwsh
        run: |
          $env:TEMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $env:TMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $failures = @()
          foreach ($testExe in ($env:CC_SWITCH_TEST_EXES -split ';')) {
            Write-Host "=== $testExe ==="
            & $testExe --test-threads=1
            if ($LASTEXITCODE -ne 0) {
              $failures += $testExe
            }
          }
          if ($failures.Count -gt 0) {
            throw "Test binaries failed: $($failures -join ', ')"
          }
