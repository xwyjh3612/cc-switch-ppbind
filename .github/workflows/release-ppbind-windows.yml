name: Publish PPBind Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ppbind-windows-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish Windows installer
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned NSIS installer
        shell: pwsh
        run: pnpm tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Prepare installer and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem -LiteralPath $bundleDir -Filter 'PPBind_*-setup.exe' -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw "PPBind NSIS installer was not found in $bundleDir"
          }

          $assetDir = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null
          $assetName = "PPBind_${version}_x64-setup.exe"
          $assetPath = Join-Path $assetDir $assetName
          Copy-Item -LiteralPath $installer.FullName -Destination $assetPath -Force
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -LiteralPath (Join-Path $assetDir 'SHA256SUMS.txt') -Encoding ascii
          Get-ChildItem -LiteralPath $assetDir | Select-Object Name, Length | Format-Table -AutoSize

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: PPBind ${{ github.ref_name }}
          prerelease: false
          body: |
            PPBind ${{ github.ref_name }} Windows installer.

            The installer is unsigned. Verify its SHA-256 using `SHA256SUMS.txt`.
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
